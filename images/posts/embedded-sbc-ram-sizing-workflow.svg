<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img">
  <title>Embedded RAM budget</title>
  <desc>Illustrative usable RAM requirement across overlapping workloads, in MiB.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267789"/></marker></defs>
  <rect width="1120" height="500" rx="20" fill="#f6f9fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" font-size="35" fill="#123750" font-weight="700" text-anchor="start">Embedded RAM budget</text>
    <text x="40" y="88" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Illustrative usable RAM requirement across overlapping workloads, in MiB.</text>
    <rect x="40" y="157" width="229.3384467881112" height="88" fill="#255474"/><text x="154.66922339405562" y="185" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">OS</text><text x="154.66922339405562" y="220" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">230</text><rect x="269.33844678811124" y="157" width="368.93576222435286" height="88" fill="#287d87"/><text x="453.80632790028767" y="185" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">App + UI</text><text x="453.80632790028767" y="220" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">370</text><rect x="638.2742090124641" y="157" width="169.51102588686481" height="88" fill="#4f6c99"/><text x="723.0297219558965" y="185" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">Update</text><text x="723.0297219558965" y="220" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">170</text><rect x="807.7852348993289" y="157" width="63.81591562799616" height="88" fill="#694d82"/><text x="839.693192713327" y="185" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">Media</text><text x="839.693192713327" y="220" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">64</text><rect x="871.601150527325" y="157" width="208.39884947267498" height="88" fill="#805b2c"/><text x="975.8005752636625" y="185" font-size="23" fill="#fff" font-weight="700" text-anchor="middle">Margin</text><text x="975.8005752636625" y="220" font-size="23" fill="#fff" font-weight="400" text-anchor="middle">209</text><text x="40" y="281" font-size="25" fill="#123750" font-weight="700" text-anchor="start">834 MiB workload estimate + 209 MiB planning margin = 1,043 MiB usable</text><rect x="40" y="313" width="1040" height="98" rx="14" fill="#e6f3ee" stroke="#adc6d6" stroke-width="2"/><text x="60" y="348" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Validate on the candidate capacity</text><text x="60" y="382" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Observe memory pressure, latency, and failed allocations during the combined workload.</text>
    <path d="M40 439 H1080" stroke="#ccd8e2"/>
    <text x="40" y="471" font-size="19" fill="#4a6273" font-weight="400" text-anchor="start">Budget any excluded reserved regions separately. Figures illustrate the method.</text>
  </g>
</svg>

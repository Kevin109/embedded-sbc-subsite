<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img">
  <title>Choose the Android release path</title>
  <desc>Begin with the APK inventory, provisioning method, and required distribution channels.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267789"/></marker></defs>
  <rect width="1120" height="500" rx="20" fill="#f6f9fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" font-size="35" fill="#123750" font-weight="700" text-anchor="start">Choose the Android release path</text>
    <text x="40" y="88" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Begin with the APK inventory, provisioning method, and required distribution channels.</text>
    <rect x="40" y="144" width="324" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="60" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">AOSP build</text><text x="60" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Platform and vendor inputs</text><text x="60" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">APK and offline validation</text><path d="M364 209 L398 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="398" y="144" width="324" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="418" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Compatibility</text><text x="418" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Release-specific CDD</text><text x="418" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">CTS and VTS evidence</text><path d="M722 209 L756 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="756" y="144" width="324" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="776" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Google services</text><text x="776" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Confirm product and SKU</text><text x="776" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Verify licensing separately</text><rect x="40" y="304" width="1040" height="106" rx="14" fill="#e6f3ee" stroke="#adc6d6" stroke-width="2"/><text x="60" y="339" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Evidence follows the shipped configuration</text><text x="60" y="373" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Bind test results and partner confirmation to the hardware, images, markets, and update path.</text>
    <path d="M40 439 H1080" stroke="#ccd8e2"/>
    <text x="40" y="471" font-size="19" fill="#4a6273" font-weight="400" text-anchor="start">CDD sets requirements. CTS and VTS generate different kinds of test evidence.</text>
  </g>
</svg>

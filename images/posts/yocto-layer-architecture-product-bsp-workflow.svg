<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Yocto layers: boundaries that survive an upgrade</title><desc>Separate what the hardware needs, what the OS permits, and what the product delivers.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Yocto layers: boundaries that survive an upgrade</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Separate what the hardware needs, what the OS permits, and what the product delivers.</text><rect x="45" y="160" width="340" height="155" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="65" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Board / BSP</text><text x="65" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Machine, kernel, device tree</text><text x="65" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Bootloader + hardware patches</text><rect x="430" y="160" width="340" height="155" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="450" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Distro policy</text><text x="450" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">System features + defaults</text><text x="450" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Shared security configuration</text><rect x="815" y="160" width="340" height="155" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="835" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Product</text><text x="835" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Applications + packagegroups</text><text x="835" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Image and service composition</text><path d="M210 315 V365 H600" fill="none" stroke="#267d91" stroke-width="3"/><path d="M600 315 V365 H600" fill="none" stroke="#267d91" stroke-width="3"/><path d="M985 315 V365 H600" fill="none" stroke="#267d91" stroke-width="3"/><path d="M600 365 L600 410" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="225" y="410" width="750" height="125" rx="14" fill="#e6f4ef" stroke="#a9bed1" stroke-width="2"/><text x="245" y="446" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Pinned manifest → build → target validation</text><text x="245" y="480" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Exact source revisions, configuration, and artifact hashes</text><text x="245" y="508" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Inspect resolved metadata; build success is not hardware validation.</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Keep private keys outside layers. Test clean rebuilds and supported machine/image combinations.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Temperature × operating state</title><desc>Use the agreed product limits, stabilization method, enclosure, supply, and workload.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Temperature × operating state</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Use the agreed product limits, stabilization method, enclosure, supply, and workload.</text><text x="245" y="165" font-size="21" fill="#123750" font-weight="700" text-anchor="start">START</text><text x="550" y="165" font-size="21" fill="#123750" font-weight="700" text-anchor="start">RUN</text><text x="870" y="165" font-size="21" fill="#123750" font-weight="700" text-anchor="start">RECOVER</text><text x="65" y="240" font-size="27" fill="#123750" font-weight="700" text-anchor="start">Cold</text><rect x="220" y="190" width="295" height="85" rx="12" fill="#e8f1f8"/><text x="238" y="238" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Unpowered soak → start</text><rect x="530" y="190" width="295" height="85" rx="12" fill="#e8f1f8"/><text x="548" y="238" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Storage + interfaces</text><rect x="840" y="190" width="295" height="85" rx="12" fill="#e8f1f8"/><text x="858" y="238" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Recovery at cold</text><text x="65" y="345" font-size="27" fill="#123750" font-weight="700" text-anchor="start">Nominal</text><rect x="220" y="295" width="295" height="85" rx="12" fill="#e6f4ef"/><text x="238" y="343" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Baseline readiness</text><rect x="530" y="295" width="295" height="85" rx="12" fill="#e6f4ef"/><text x="548" y="343" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Reference throughput</text><rect x="840" y="295" width="295" height="85" rx="12" fill="#e6f4ef"/><text x="858" y="343" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Full functional check</text><text x="65" y="450" font-size="27" fill="#123750" font-weight="700" text-anchor="start">Hot</text><rect x="220" y="400" width="295" height="85" rx="12" fill="#fff0d9"/><text x="238" y="448" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Restart while hot</text><rect x="530" y="400" width="295" height="85" rx="12" fill="#fff0d9"/><text x="548" y="448" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Sustained real workload</text><rect x="840" y="400" width="295" height="85" rx="12" fill="#fff0d9"/><text x="858" y="448" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Recovery at hot</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Log ambient, component temperatures, power, performance, and failures. No universal dwell implied.</text></g></svg>

baseURL = "https://embedded-sbc.com/"
languageCode = "en-us"
title = "Embedded SBC Blog"
theme = "PaperMod"
enableRobotsTXT = true
defaultContentLanguage = "en"

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "Insights and technical articles on Android SBCs, Linux SBCs, and custom embedded board solutions."
  author = "Embedded SBC Team"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  disableScrollToTop = false
  hideFooter = false
  DateFormat = "2006-01-02"
  UseHugoToc = true
  comments = false
  disableSpecial1stPost = true
  logo = "/favicon-64x64.png"
  logoAlt = "Embedded SBC Logo"

[params.assets]
  customCSS = ["css/custom.css"]
  disableFingerprinting = false

[params.schema]
  publisherType = "Organization"
  sameAs = [
    "https://www.rocktech.com.hk/",
    "https://android-sbc.com/",
    "https://github.com/Kevin109/embedded-sbc-subsite"
  ]

  [params.schema.contactPoint]
    contactType = "editorial"
    email = "sales@android-board.com"
    availableLanguage = ["en"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]


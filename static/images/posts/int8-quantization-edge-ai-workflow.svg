<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>INT8: separate calibration from acceptance</title><desc>Source model and preprocessing stay versioned throughout the experiment.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">INT8: separate calibration from acceptance</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Source model and preprocessing stay versioned throughout the experiment.</text><rect x="50" y="150" width="300" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="70" y="186" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Floating-point baseline</text><text x="70" y="220" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Model + input contract</text><text x="70" y="248" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Reference quality report</text><path d="M350 210 L425 210" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="425" y="150" width="330" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="445" y="186" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Calibration + conversion</text><text x="445" y="220" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Representative inputs</text><text x="445" y="248" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Quantizer + target compiler</text><path d="M755 210 L830 210" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="830" y="150" width="320" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="850" y="186" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Deployable INT8 artifact</text><text x="850" y="220" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Graph placement report</text><text x="850" y="248" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Precision / fallback map</text><path d="M980 270 L980 355" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="680" y="355" width="470" height="150" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="700" y="391" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Independent release gates</text><text x="700" y="425" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Held-out quality by operating condition</text><text x="700" y="453" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Target latency, memory, power, thermals</text><rect x="50" y="355" width="490" height="150" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="70" y="391" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Keep evaluation data independent</text><text x="70" y="425" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Split related scenes and near-duplicate frames.</text><text x="70" y="453" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Do not tune calibration against the final test set.</text><path d="M540 430 L680 430" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Pass both gates: acceptable decisions AND a useful product-level performance result.</text></g></svg>

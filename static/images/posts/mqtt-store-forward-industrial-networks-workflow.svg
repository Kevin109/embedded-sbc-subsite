<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img">
  <title>MQTT telemetry delivery boundaries</title>
  <desc>A local queue bridges downtime between the collector and the WAN.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267789"/></marker></defs>
  <rect width="1120" height="500" rx="20" fill="#f6f9fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" font-size="35" fill="#123750" font-weight="700" text-anchor="start">MQTT telemetry delivery boundaries</text>
    <text x="40" y="88" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">A local queue bridges downtime between the collector and the WAN.</text>
    <rect x="40" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="60" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Acquire</text><text x="60" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Assign event ID</text><text x="60" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Attach event time</text><path d="M274.5 209 L308.5 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="308.5" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="328.5" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Commit locally</text><text x="328.5" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Durable queue</text><text x="328.5" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Bound disk use</text><path d="M543 209 L577 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="577" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="597" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Publish</text><text x="597" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Retry and pace</text><text x="597" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Match QoS policy</text><path d="M811.5 209 L845.5 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="845.5" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="865.5" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Confirm</text><text x="865.5" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Broker or destination</text><text x="865.5" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Retire on chosen ACK</text><rect x="40" y="304" width="1040" height="106" rx="14" fill="#e6f3ee" stroke="#adc6d6" stroke-width="2"/><text x="60" y="339" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Reconcile after power loss</text><text x="60" y="373" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Replay pending records with the same ID. The receiver applies each ID idempotently.</text>
    <path d="M40 439 H1080" stroke="#ccd8e2"/>
    <text x="40" y="471" font-size="19" fill="#4a6273" font-weight="400" text-anchor="start">Keep new acquisition independent of reconnect and backlog replay.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Measure power-to-ready, not just Linux startup</title><desc>A service marked started may still be loading data or waiting for its first valid frame.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Measure power-to-ready, not just Linux startup</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">A service marked started may still be loading data or waiting for its first valid frame.</text><rect x="40" y="185" width="215" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="60" y="221" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Power valid</text><text x="60" y="255" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">External trigger</text><rect x="275" y="185" width="215" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="295" y="221" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Bootloader</text><text x="295" y="255" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Load + verify</text><rect x="510" y="185" width="215" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="530" y="221" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Kernel</text><text x="530" y="255" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Probe + mount</text><rect x="745" y="185" width="215" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="765" y="221" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Services</text><text x="765" y="255" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Dependencies</text><rect x="980" y="185" width="215" height="120" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="1000" y="221" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Product ready</text><text x="1000" y="255" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Usable output</text><path d="M255 245 L275 245" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M490 245 L510 245" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M725 245 L745 245" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M960 245 L980 245" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M65 340 V385 H1135 V340" fill="none" stroke="#267d91" stroke-width="3"/><text x="600" y="425" font-size="26" fill="#123750" font-weight="700" text-anchor="middle">External instrument measures the complete interval</text><rect x="80" y="465" width="1040" height="78" rx="14" fill="#fff0d9" stroke="#a9bed1" stroke-width="2"/><text x="100" y="501" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Run cold boot, warm reboot, recovery, and absent-network cases.</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Correlate internal logs to external markers; report the distribution and all failed starts.</text></g></svg>

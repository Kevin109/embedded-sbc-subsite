<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Four cameras: follow the DDR transactions</title><desc>Example: 4 × 1920 × 1080 × 30 fps. Decimal MB/s, no padding or extra workloads.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Four cameras: follow the DDR transactions</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Example: 4 × 1920 × 1080 × 30 fps. Decimal MB/s, no padding or extra workloads.</text><rect x="45" y="160" width="330" height="135" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="65" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Capture → RAW16</text><text x="65" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">DDR write: 497.664 MB/s</text><text x="65" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Unpacked 16-bit storage</text><path d="M375 225 L435 225" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="435" y="160" width="330" height="135" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="455" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">ISP → NV12</text><text x="455" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">RAW read: 497.664 MB/s</text><text x="455" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">NV12 write: 373.248 MB/s</text><path d="M765 225 L825 225" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="825" y="160" width="330" height="135" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="845" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Two NV12 consumers</text><text x="845" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Inference read: 373.248 MB/s</text><text x="845" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Encoder read: 373.248 MB/s</text><rect x="100" y="365" width="1000" height="155" rx="14" fill="#fff0d9" stroke="#a9bed1" stroke-width="2"/><text x="120" y="401" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Analytical DDR subtotal: 2,115.072 MB/s</text><text x="120" y="435" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Wire RAW10 active-pixel payload: 311.040 MB/s across all four cameras.</text><text x="120" y="463" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Add tensors, encoder references, display, padding, and all other traffic.</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Direct streaming may remove transactions. Extra copies may add them. Measure the actual pipeline.</text></g></svg>

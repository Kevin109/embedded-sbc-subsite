<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img">
  <title>Android boot handoffs</title>
  <desc>Identify the last successful event before inspecting or replacing an artifact.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267789"/></marker></defs>
  <rect width="1120" height="500" rx="20" fill="#f6f9fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="54" font-size="35" fill="#123750" font-weight="700" text-anchor="start">Android boot handoffs</text>
    <text x="40" y="88" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Identify the last successful event before inspecting or replacing an artifact.</text>
    <rect x="40" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="60" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">ROM + firmware</text><text x="60" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Select media</text><text x="60" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Initialize platform</text><path d="M274.5 209 L308.5 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="308.5" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="328.5" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Bootloader / AVB</text><text x="328.5" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Select slot</text><text x="328.5" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Verify images</text><path d="M543 209 L577 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="577" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="597" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Kernel + init</text><text x="597" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">DTB and ramdisk</text><text x="597" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Mount system volumes</text><path d="M811.5 209 L845.5 209" stroke="#267789" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="845.5" y="144" width="234.5" height="130" rx="14" fill="#e5f0f7" stroke="#adc6d6" stroke-width="2"/><text x="865.5" y="179" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Android services</text><text x="865.5" y="213" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Start required HALs</text><text x="865.5" y="240" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Report app readiness</text><rect x="40" y="304" width="1040" height="106" rx="14" fill="#e6f3ee" stroke="#adc6d6" stroke-width="2"/><text x="60" y="339" font-size="26" fill="#103b53" font-weight="700" text-anchor="start">Keep the evidence tied to the active slot</text><text x="60" y="373" font-size="21" fill="#233d51" font-weight="400" text-anchor="start">Record boot logs, image hashes, partition metadata, trust policy, and the approved recovery path.</text>
    <path d="M40 439 H1080" stroke="#ccd8e2"/>
    <text x="40" y="471" font-size="19" fill="#4a6273" font-weight="400" text-anchor="start">The vendor boot chain and Android launch configuration determine the exact artifacts.</text>
  </g>
</svg>

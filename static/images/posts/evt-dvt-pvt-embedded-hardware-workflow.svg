<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Three builds, three different questions</title><desc>Gate decisions require traceable evidence, not just a batch of working boards.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Three builds, three different questions</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Gate decisions require traceable evidence, not just a batch of working boards.</text><rect x="50" y="180" width="330" height="210" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="70" y="216" font-size="25" fill="#123750" font-weight="700" text-anchor="start">EVT · Architecture</text><text x="70" y="250" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Power + boot + interfaces</text><text x="70" y="278" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Close feasibility risks</text><text x="70" y="306" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Document every workaround</text><path d="M380 285 L435 285" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="435" y="180" width="330" height="210" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="455" y="216" font-size="25" fill="#123750" font-weight="700" text-anchor="start">DVT · Design</text><text x="455" y="250" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Production-intent assembly</text><text x="455" y="278" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Verify product requirements</text><text x="455" y="306" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Close design defects</text><path d="M765 285 L820 285" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="820" y="180" width="330" height="210" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="840" y="216" font-size="25" fill="#123750" font-weight="700" text-anchor="start">PVT · Process</text><text x="840" y="250" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Intended line + fixtures</text><text x="840" y="278" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Track first-pass yield</text><text x="840" y="306" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Verify repeatable release</text><rect x="170" y="455" width="860" height="85" rx="14" fill="#fff0d9" stroke="#a9bed1" stroke-width="2"/><text x="190" y="491" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Any material change → impact review + targeted regression</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Keep hardware, BOM, firmware, fixture revisions, and gate approvals in the same release ledger.</text></g></svg>

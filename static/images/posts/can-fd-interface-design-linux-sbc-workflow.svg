<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>CAN FD: topology and capability both matter</title><desc>Conceptual bus drawing; component values and layout require a design-specific review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">CAN FD: topology and capability both matter</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Conceptual bus drawing; component values and layout require a design-specific review.</text><rect x="50" y="145" width="310" height="115" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="70" y="181" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Linux SBC</text><text x="70" y="215" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">FD controller → transceiver</text><rect x="450" y="145" width="300" height="115" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="470" y="181" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Middle node</text><text x="470" y="215" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Short qualified stub</text><rect x="840" y="145" width="310" height="115" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="860" y="181" font-size="25" fill="#123750" font-weight="700" text-anchor="start">End node</text><text x="860" y="215" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Compatible FD traffic</text><path d="M110 350 H1090 M205 260 V350 M600 260 V350 M995 260 V350" fill="none" stroke="#267d91" stroke-width="8"/><rect x="50" y="385" width="240" height="100" rx="14" fill="#e6f4ef" stroke="#a9bed1" stroke-width="2"/><text x="70" y="421" font-size="25" fill="#123750" font-weight="700" text-anchor="start">120 Ω at end</text><text x="70" y="455" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Not every node</text><rect x="910" y="385" width="240" height="100" rx="14" fill="#e6f4ef" stroke="#a9bed1" stroke-width="2"/><text x="930" y="421" font-size="25" fill="#123750" font-weight="700" text-anchor="start">120 Ω at end</text><text x="930" y="455" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Conventional bus</text><path d="M110 350 V385 M1090 350 V385" stroke="#267d91" stroke-width="3"/><text x="600" y="430" font-size="24" fill="#123750" font-weight="700" text-anchor="middle">Linear trunk + controlled stubs</text><text x="600" y="472" font-size="20" fill="#273c53" font-weight="400" text-anchor="middle">Qualify rate, cable, timing, grounding, and faults</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Controller support ≠ transceiver support ≠ validated network. Test the full chain.</text></g></svg>

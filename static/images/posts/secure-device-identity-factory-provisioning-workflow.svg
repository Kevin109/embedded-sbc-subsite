<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"><title>Provision identity with a durable transaction</title><desc>Device key generation and certificate issuance must stay bound to the same physical unit.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#267d91"/></marker></defs><rect width="1200" height="660" rx="20" fill="#f7fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="56" font-size="34" fill="#123750" font-weight="700" text-anchor="start">Provision identity with a durable transaction</text><text x="44" y="94" font-size="21" fill="#273c53" font-weight="400" text-anchor="start">Device key generation and certificate issuance must stay bound to the same physical unit.</text><rect x="45" y="160" width="330" height="150" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="65" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Authorize station + unit</text><text x="65" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Work order and serial policy</text><text x="65" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Approved image / hardware</text><path d="M375 235 L430 235" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="430" y="160" width="330" height="150" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="450" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Device key + certificate</text><text x="450" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Protected private-key operation</text><text x="450" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Authorized issuance service</text><path d="M760 235 L815 235" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="815" y="160" width="340" height="150" rx="14" fill="#e8f1f8" stroke="#a9bed1" stroke-width="2"/><text x="835" y="196" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Verify + release</text><text x="835" y="230" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Vendor-specific lock sequence</text><text x="835" y="258" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Reboot and authenticate</text><path d="M210 310 L210 400" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M595 310 L595 400" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M985 310 L985 400" stroke="#267d91" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="45" y="400" width="1110" height="125" rx="14" fill="#e6f4ef" stroke="#a9bed1" stroke-width="2"/><text x="65" y="436" font-size="25" fill="#123750" font-weight="700" text-anchor="start">Durable provisioning journal</text><text x="65" y="470" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Unit + public-key fingerprint + certificate + station + transaction + disposition</text><text x="65" y="498" font-size="20" fill="#273c53" font-weight="400" text-anchor="start">Retry by reconciling state; quarantine ambiguous results. Never log private keys.</text><path d="M44 588 H1156" stroke="#ccd8e2"/><text x="44" y="625" font-size="19" fill="#536b7d" font-weight="400" text-anchor="start">Identity keys, firmware-signing keys, and service authorization are separate responsibilities.</text></g></svg>
